format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

include:
- repository: steps-check
  branch: master
  path: steps.bitrise.yml

workflows:
  # check: included from steps-check/steps.bitrise.yml

  e2e:
    steps:
    - git::https://github.com/bitrise-steplib/steps-check.git:
        inputs:
        - workflow: e2e

  sample:
    description: |-
      Starts a Workflow of an existing Bitrise app and waits for it, for local debugging.

      The step reads the app, build slug and build number of the parent build from the environment, the same way it
      does in a Bitrise build. Define these envs in your .bitrise.secrets.yml:
      - SAMPLE_APP_SLUG: the app to start the Workflow in
      - SAMPLE_BUILD_SLUG: a finished build of that app, its build params are reused for the started build
      - SAMPLE_WORKFLOW: the Workflow to start
      - BITRISE_TOKEN: a Personal Access Token with access to the app
    envs:
    - BITRISE_APP_SLUG: $SAMPLE_APP_SLUG
    - BITRISE_BUILD_SLUG: $SAMPLE_BUILD_SLUG
    - BITRISE_BUILD_NUMBER: "1"
    steps:
    - path::./:
        inputs:
        - access_token: $BITRISE_TOKEN
        - workflows: $SAMPLE_WORKFLOW
        - wait_for_builds: "true"
        - verbose: "yes"

  generate_readme:
    steps:
    - git::https://github.com/bitrise-steplib/steps-readme-generator.git@main:
        inputs:
        - contrib_section: docs/contribution.md
        - example_section: docs/examples.md
